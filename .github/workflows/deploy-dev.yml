name: Deploy to Dev

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Build frontend on the runner
      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & build assets
        run: |
          npm ci
          npm run build
        env:
          # prevents some CI strictness from failing on warnings
          CI: false

      # 2) Deploy code (including public/build) to Hostinger
      - name: Upload code to Hostinger
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "./"
          TARGET: "${{ secrets.DEV_APP_DIR }}"
          ARGS: "-az --delete"
          EXCLUDE: >
            .git*
            node_modules/
            vendor/
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            storage/logs/*
            .env
            .github/

      # 3) Run composer + laravel optimize on the server
      - name: Finalize on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEV_APP_DIR }}"
            # install php deps without dev, optimized autoloader
            composer install --no-dev --prefer-dist --optimize-autoloader
            php artisan migrate --force || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chmod -R 775 storage bootstrap/cache || true