      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEV_APP_DIR }}"
            cd "$APP_DIR"

            # Trust GitHub host key (non-interactive git fetch)
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts || true
            chmod 600 ~/.ssh/known_hosts || true

            # Avoid "safe.directory" warnings on shared hosting
            git config --global --add safe.directory "$APP_DIR"

            # Update code
            git fetch origin dev
            git checkout dev || true
            git reset --hard origin/dev

            # Composer (fallback to local composer.phar if global not available)
            if command -v composer >/dev/null 2>&1; then
              COMPOSER_BIN="composer"
            else
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --quiet
              rm composer-setup.php
              COMPOSER_BIN="php composer.phar"
            fi

            $COMPOSER_BIN install --no-dev --prefer-dist --optimize-autoloader

            php artisan down || true
            php artisan migrate --force || true  # keep site up if DB not ready
            php artisan config:clear && php artisan route:clear && php artisan view:clear
            php artisan config:cache && php artisan route:cache && php artisan view:cache
            php artisan optimize
            chmod -R 775 storage bootstrap/cache || true
            php artisan up || true

            echo "✅ Deployment complete"